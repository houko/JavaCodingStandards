name: Dependabot merge

# Turns on auto-merge for Dependabot's pull requests, so GitHub merges each once CI passes. Dependabot only updates the GitHub Actions the workflows use (.github/dependabot.yml), which do not change the site, so no deploy follows.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge "$PR" --auto --squash --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
